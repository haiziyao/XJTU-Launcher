# 放进 /etc/nginx/conf.d/（http 上下文），或在已有 http 块里声明一次。
limit_req_zone $binary_remote_addr zone=xjtu_download:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=xjtu_download_conn:10m;

