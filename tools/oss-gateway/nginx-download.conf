# 放进 /etc/nginx/conf.d/（http 上下文），或在已有 http 块里声明一次。
#
# 校园网 / 办公室 NAT 下很多人共用一个出口 IP，按 IP 限流只能当宽松的兜底：
# 真正公平的配额在网关里按浏览器 Cookie 算（DOWNLOAD_QUOTA，默认 20 次/10 分钟）。
limit_req_zone $binary_remote_addr zone=xjtu_download:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=xjtu_download_conn:10m;

