# 官网点赞与下载量接口。两段都要用：http{} 里的限流 zone，server{} 里的反代。
#
# http{} 块（可并入 /www/server/nginx/conf/xjtu-launcher-limits.conf）：
limit_req_zone $binary_remote_addr zone=xjtu_site_api:10m rate=30r/m;

# server{} 块：正式域名（站点根目录 /）
location ^~ /api/ {
    limit_req zone=xjtu_site_api burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

# server{} 块：备案前的 IP 预览（站点在 /site/，页面里的相对地址 api/stats
# 会变成 /site/api/stats）。proxy_pass 末尾的 / 会去掉匹配到的前缀。
location ^~ /site/api/ {
    limit_req zone=xjtu_site_api burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}
