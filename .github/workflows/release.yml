name: Signed desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide whether this push actually needs a release. main is pushed on every
  # merge, so a version that already has a published release must be a no-op.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check version, release notes and existing release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes. Every release needs a version record."
            exit 1
          fi
          if grep -q 'YYYY-MM-DD' "$notes"; then
            echo "::error::$notes still contains template placeholders."
            exit 1
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$version\" and .draft == false) | .tag_name")
          if [ -n "$published" ]; then
            echo "v$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Do not build or publish a release from code that fails the desktop checks.
  verify:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  release:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      # tauri-action 无法按 tag 查询草稿发布，只能取列表里第一个同名草稿；
      # 并行 job 会各自建草稿并分散上传，串行执行保证三个平台合并到同一个草稿。
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      # P0: hard-coded plain HTTP manifest until it gets a domain and
      # certificate. Served through nginx by the OSS download gateway.
      XJTU_UPDATE_ENDPOINT: http://8.152.100.169/latest.json
      XJTU_UPDATE_PUBLIC_KEY: ${{ vars.XJTU_UPDATE_PUBLIC_KEY }}
      XJTU_PLUGIN_SERVER: ${{ vars.XJTU_PLUGIN_SERVER }}
      # No Developer ID yet: ad-hoc sign the bundle so macOS does not report
      # "the app is damaged". A real certificate secret overrides this.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: node tools/prepare-release.mjs
      - name: Load the version record as the release body
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat "docs/releases/v${{ needs.prepare.outputs.version }}.md"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: XJTU Launcher v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          # Stay a draft until the publish job sees all three platforms.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config .release/tauri.conf.json
      # 0.5.0 exited during plugin init and 0.5.1's bundle was unsigned, so
      # launch the real release build and require it to survive startup.
      - name: Smoke-test the macOS app
        if: matrix.os == 'macos-latest'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/XJTU Launcher.app"
          "$app/Contents/MacOS/xjtu-launcher" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "App exited during startup:"
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          kill "$pid" || true
          echo "App stayed alive for 10s."

  # Copy the draft's assets into the private OSS bucket and rewrite latest.json
  # to the download gateway before the release goes public. Skipped until the
  # OSS_* repository variables and secrets are configured.
  oss:
    needs: [prepare, release]
    if: needs.prepare.outputs.publish == 'true' && vars.OSS_BUCKET != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_PUBLIC_BASE: ${{ vars.OSS_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ossutil 1.7.18
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ossutil.zip \
            https://github.com/aliyun/ossutil/releases/download/v1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -q -o /tmp/ossutil.zip -d /tmp/ossutil
          install -m 755 "$(find /tmp/ossutil -type f -name 'ossutil*' ! -name '*.zip' | head -n1)" /usr/local/bin/ossutil
          ossutil --version
      - name: Write the ossutil config
        env:
          # `runner` is only available to steps, not to job-level env.
          OSS_CONFIG_FILE: ${{ runner.temp }}/ossutilconfig
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo '[Credentials]'
            echo 'language=EN'
            echo 'endpoint=https://oss-cn-beijing.aliyuncs.com'
            echo "accessKeyID=$OSS_ACCESS_KEY_ID"
            echo "accessKeySecret=$OSS_ACCESS_KEY_SECRET"
          } > "$OSS_CONFIG_FILE"
      - name: Download the draft assets
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$VERSION\" and .draft == true) | .id" | head -n1)
          [ -n "$release_id" ] || { echo "::error::Draft release v$VERSION not found."; exit 1; }
          mkdir -p assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | [.name, .id] | @tsv' |
            while IFS=$'\t' read -r name id; do
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
                -H "Accept: application/octet-stream" > "assets/$name"
            done
          ls -l assets
      - name: Upload to OSS and rewrite latest.json
        env:
          OSS_CONFIG_FILE: ${{ runner.temp }}/ossutilconfig
        run: node tools/upload-oss.mjs

  # Publishing only after every platform succeeded keeps the release and
  # latest.json complete; a failed run leaves a resumable draft.
  publish:
    needs: [prepare, release, oss]
    if: |
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.release.result == 'success' &&
      (needs.oss.result == 'success' || needs.oss.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Verify every asset and latest.json, then publish
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$VERSION\" and .draft == true) | .id" | head -n1)
          if [ -z "$release_id" ]; then
            echo "::error::Draft release v$VERSION not found."
            exit 1
          fi
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name')
          missing=0
          for asset in \
            "XJTU.Launcher_${VERSION}_aarch64.dmg" \
            "XJTU.Launcher_${VERSION}_aarch64.app.tar.gz" \
            "XJTU.Launcher_${VERSION}_aarch64.app.tar.gz.sig" \
            "XJTU.Launcher_${VERSION}_x64.dmg" \
            "XJTU.Launcher_${VERSION}_x64.app.tar.gz" \
            "XJTU.Launcher_${VERSION}_x64.app.tar.gz.sig" \
            "XJTU.Launcher_${VERSION}_x64-setup.exe" \
            "XJTU.Launcher_${VERSION}_x64-setup.exe.sig" \
            "latest.json"; do
            if ! grep -qxF "$asset" <<<"$assets"; then
              echo "::error::Missing asset $asset"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          json_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$json_id" \
            -H "Accept: application/octet-stream" > "$RUNNER_TEMP/latest.json"
          jq -e --arg v "$VERSION" '
            .version == $v and
            ((.platforms | keys | sort) == [
              "darwin-aarch64", "darwin-aarch64-app",
              "darwin-x86_64", "darwin-x86_64-app",
              "windows-x86_64", "windows-x86_64-nsis"
            ])
          ' "$RUNNER_TEMP/latest.json" > /dev/null

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F make_latest=true > /dev/null
          echo "Published v$VERSION with all platform assets."
