name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Validate release version
        run: node tools/prepare-release.mjs
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config .release/tauri.conf.json -- --locked
      - name: Collect installers and checksums
        run: node tools/collect-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: .release/assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify downloads and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "XJTU Launcher $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" release-assets/*.dmg release-assets/*.exe release-assets/*.msi release-assets/*.deb release-assets/*.AppImage release-assets/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
