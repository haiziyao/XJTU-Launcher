name: Signed desktop release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      XJTU_UPDATE_ENDPOINT: ${{ vars.XJTU_UPDATE_ENDPOINT }}
      XJTU_UPDATE_PUBLIC_KEY: ${{ vars.XJTU_UPDATE_PUBLIC_KEY }}
      XJTU_PLUGIN_SERVER: ${{ vars.XJTU_PLUGIN_SERVER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: node tools/prepare-release.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: XJTU Launcher v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config .release/tauri.conf.json
