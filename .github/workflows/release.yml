name: Signed desktop release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      # tauri-action 无法按 tag 查询草稿发布，只能取列表里第一个同名草稿；
      # 并行 job 会各自建草稿并分散上传，串行执行保证三个平台合并到同一个草稿。
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      # P0: hard-coded plain HTTP mirror until it gets a domain and certificate.
      XJTU_UPDATE_ENDPOINT: http://8.152.100.169/xjtu-launcher/latest.json
      XJTU_UPDATE_PUBLIC_KEY: ${{ vars.XJTU_UPDATE_PUBLIC_KEY }}
      XJTU_PLUGIN_SERVER: ${{ vars.XJTU_PLUGIN_SERVER }}
      # No Developer ID yet: ad-hoc sign the bundle so macOS does not report
      # "the app is damaged". A real certificate secret overrides this.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: node tools/prepare-release.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: XJTU Launcher v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config .release/tauri.conf.json
      # 0.5.0 exited during plugin init and 0.5.1's bundle was unsigned, so
      # launch the real release build and require it to survive startup.
      - name: Smoke-test the macOS app
        if: matrix.os == 'macos-latest'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/XJTU Launcher.app"
          "$app/Contents/MacOS/xjtu-launcher" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "App exited during startup:"
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          kill "$pid"
          echo "App stayed alive for 10s."
