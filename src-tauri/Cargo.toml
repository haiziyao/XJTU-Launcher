[package]
name = "xjtu-launcher"
version = "0.5.0"
license = "MIT"
description = "A local campus workspace"
edition = "2021"

[lib]
name = "xjtu_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
sha2 = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream", "multipart"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
tokio = { version = "1", features = ["sync", "process", "io-util", "fs", "time", "rt", "net", "macros"] }
tempfile = "3"
# Loopback MCP endpoint. hyper is already in the tree through reqwest, so this
# adds only direct edges, not new downloads.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"

reqwest_cookie_store = "0.8"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
aes = "0.8"
cfb-mode = "0.8"
hex = "0.4"
scraper = "0.24"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
aes-gcm = "0.10"
cookie_store = "0.21"

# Image codecs are very slow unoptimised; keep avatar and wallpaper import responsive under `tauri dev`.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
