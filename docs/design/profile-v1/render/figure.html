<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../layout-v2/render/v2.css">
<style>
body { background: #fff; }
.sheet { width: 1120px; height: 760px; padding: 28px 36px; display: grid; grid-template-columns: 420px 1fr; gap: 28px; }
.hero { border: 1px solid var(--border); border-radius: 12px; background: linear-gradient(180deg, #f7f9fc, #eef2f8); display: flex; align-items: center; justify-content: center; position: relative; }
.hero svg { height: 640px; }
.hero .tag { position: absolute; left: 16px; top: 12px; font-size: 12px; color: var(--text-tertiary); }
.side { display: flex; flex-direction: column; gap: 16px; }
.side h2 { margin: 0; font-size: 15px; font-weight: 600; }
.side p { margin: 0; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.var { border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.var svg { height: 250px; }
.var b { font-size: 12.5px; font-weight: 600; }
.var span { font-size: 11px; color: var(--text-tertiary); }
.ctx { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: center; }
.ctx svg { height: 210px; }
.ctx .k2 { font-size: 11px; color: var(--text-tertiary); }
.ctx .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ctx .v small { font-size: 11px; font-weight: 400; color: var(--text-tertiary); margin-left: 2px; }
</style></head>

<div class="sheet">
  <div class="hero">
    <span class="tag">体格人物 · 精细稿</span>
    <svg viewBox="0 0 200 504">
      <ellipse cx="100" cy="494" rx="52" ry="7" fill="url(#floor)"/>

    </svg>
  </div>
  <div class="side">
    <div><h2>体型随 BMI 变化</h2><p>身体按 BMI 横向缩放，头部与五官保持不变；人物高度只表示比例，不推断肌肉或体脂。</p></div>
    <div class="row">
      <div class="var"><svg viewBox="0 0 200 504"><ellipse cx="100" cy="494" rx="46" ry="6" fill="url(#floor)"/><g transform="translate(100 0) scale(.88 1) translate(-100 0)"><use href="#leg-l"/><use href="#leg-l" transform="translate(200 0) scale(-1 1)"/><use href="#torso"/><use href="#arm-l"/><use href="#arm-l" transform="translate(200 0) scale(-1 1)"/></g><use href="#head"/></svg><b>偏瘦</b><span>BMI &lt; 18.5</span></div>
      <div class="var"><svg viewBox="0 0 200 504"><ellipse cx="100" cy="494" rx="52" ry="7" fill="url(#floor)"/><use href="#man"/></svg><b>正常</b><span>18.5 – 24</span></div>
      <div class="var"><svg viewBox="0 0 200 504"><ellipse cx="100" cy="494" rx="58" ry="7" fill="url(#floor)"/><g transform="translate(100 0) scale(1.14 1) translate(-100 0)"><use href="#leg-l"/><use href="#leg-l" transform="translate(200 0) scale(-1 1)"/><use href="#torso"/><use href="#arm-l"/><use href="#arm-l" transform="translate(200 0) scale(-1 1)"/></g><use href="#head"/></svg><b>偏重</b><span>BMI ≥ 24</span></div>

        <ellipse cx="130" cy="494" rx="52" ry="7" fill="url(#floor)"/>
        <use href="#man" transform="translate(30 0)"/>

        <div><div class="k2">身高 / 体重</div><div class="v">176.2<small>cm</small> · 66.0<small>kg</small></div></div>
